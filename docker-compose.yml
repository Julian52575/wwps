services:
  
  traefik:
    build:
      dockerfile: docker/traefik.Dockerfile
      context: .
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/certificates/dynamic.yml"
      - "--entrypoints.web.address=:5555"
      - "--entrypoints.websecure.address=:443"
      # For healthcheck
      - --ping=true
      - --ping.entrypoint=traefik
      - --entrypoints.traefik.address=:8082
    volumes:
      - "${DOCKER_SOCKET}:/var/run/docker.sock:ro"
      - "./certificates:/certificates:ro"
    ports:
      - "80:5555"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8082/ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  wwps:
    build:
      context: .
      dockerfile: docker/wwps.Dockerfile
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wwps.rule=Host(`${SERVER_HOST}`)"
      - "traefik.http.services.wwps.loadbalancer.server.port=${WWPS_PORT}"
      - "traefik.http.routers.wwps.entrypoints=websecure"
      - "traefik.http.routers.wwps.tls=true"
    depends_on:
      traefik:
        condition: service_healthy
      postgres:
          condition: service_healthy
  #wwps-tests:
  #  build:
  #    context: .
  #    target: test
  #  depends_on:
  #    postgres:
  #      condition: service_healthy


volumes:
  postgres_data:
