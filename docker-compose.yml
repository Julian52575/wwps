services:
  
  traefik:
    image: traefik:v3.7.8
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:5555"
    volumes:
      - "${DOCKER_SOCKET}:/var/run/docker.sock:ro"
    ports:
      - "80:5555"
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -S /var/run/docker.sock && wget -qO- --header='Host: d' http://localhost:8080/ping >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  wwps:
    build:
      context: .
      target: wwps
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wwps.rule=Host(`${SERVER_HOST}`)"
      - "traefik.http.routers.wwps.entrypoints=web"
      - "traefik.http.services.wwps.loadbalancer.server.port=${WWPS__PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_healthy
  #wwps-tests:
  #  build:
  #    context: .
  #    target: test
  #  depends_on:
  #    postgres:
  #      condition: service_healthy


volumes:
  postgres_data:
